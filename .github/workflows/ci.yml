name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-strings.py
      - run: swift build -c release
      - run: bash -n bridge/agent-notch-hook scripts/*.sh
